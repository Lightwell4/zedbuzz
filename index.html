<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZedBuzz 🇿🇲 | Trending Zambia</title>
    <style>
        :root { --primary: #00FF41; --bg: #0a0a0a; --card: #161616; --wa: #25D366; --fb: #1877F2; }
        body { margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: white; }
        
        header { 
            background: var(--bg); color: var(--primary); padding: 15px; 
            text-align: center; font-size: 26px; font-weight: 900; 
            border-bottom: 2px solid #222; position: sticky; top: 0; z-index: 100;
        }

        /* Search Section */
        .search-container {
            max-width: 500px; margin: 10px auto; padding: 0 10px;
            display: flex; gap: 5px;
        }
        #searchInput {
            flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333;
            background: #1a1a1a; color: white; font-size: 16px;
        }
        #searchInput:focus { outline: 1px solid var(--primary); }

        .feed { max-width: 500px; margin: auto; padding: 10px; }

        .post { 
            background: var(--card); margin-bottom: 25px; border-radius: 15px; 
            overflow: hidden; border: 1px solid #222; 
        }

        .video-container {
            position: relative; padding-bottom: 56.25%; height: 0;
            overflow: hidden; background: #000;
        }
        .video-container iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

        .post-content { padding: 15px; }
        .caption { font-size: 18px; font-weight: 700; margin-bottom: 12px; line-height: 1.3; }
        
        .share-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .btn { 
            display: flex; align-items: center; justify-content: center;
            padding: 12px; border-radius: 8px; font-weight: bold; 
            border: none; cursor: pointer; font-size: 14px;
        }
        .btn:active { opacity: 0.7; transform: scale(0.98); }

        .btn-wa { background: var(--wa); color: white; }
        .btn-fb { background: var(--fb); color: white; }
        .btn-copy { background: #333; color: white; grid-column: span 2; margin-top: 5px; }

        .no-results { text-align: center; padding: 40px; color: #888; }
    </style>
</head>
<body>

<header>🇿🇲 ZEDBUZZ 🔥</header>

<div class="search-container">
    <input type="text" id="searchInput" placeholder="Search music, news, or comedy..." onkeyup="searchPosts()">
</div>

<div class="feed" id="feed"></div>

<script>
const feed = document.getElementById('feed');

// REAL TRENDING ZAMBIAN CONTENT
const zedContent = [
    { id: "T75qYV7-m0M", caption: "Bomb$hell Grenade ft. Yo Maps – 'Weka' (Official Video) 🔥🇿🇲", tags: "music music-video" },
    { id: "vI73L_yqMks", caption: "Roberto – 'Uzanisiya?' (The biggest song in Lusaka right now) 🎵", tags: "music pop" },
    { id: "pYpS_jH5D9U", caption: "Livingstone Crocodile Park saga: What happened with Pompi? 🐊", tags: "news viral" },
    { id: "3Hn9hLOXJIY", caption: "Solontoni Comedy: 'Zambian Mothers vs Technology' 😂", tags: "comedy funny" },
    { id: "ScMzIvxBSi4", caption: "Zambia National Team: Preparing for the next qualifier! ⚽", tags: "sports news" }
];

// Function to build a post
function renderPost(item) {
    const postURL = window.location.origin + window.location.pathname + "?v=" + item.id;
    return `
        <div class="post">
            <div class="video-container">
                <iframe src="https://youtube.com{item.id}" allowfullscreen></iframe>
            </div>
            <div class="post-content">
                <div class="caption">${item.caption}</div>
                <div class="share-grid">
                    <button class="btn btn-wa" onclick="shareWA('${postURL}', '${item.caption}')">WhatsApp</button>
                    <button class="btn btn-fb" onclick="shareFB('${postURL}')">Facebook</button>
                    <button class="btn btn-copy" onclick="copyLink('${postURL}')">🔗 Copy Link</button>
                </div>
            </div>
        </div>
    `;
}

// Initial Load
function displayPosts(contentArray) {
    feed.innerHTML = contentArray.length > 0 
        ? contentArray.map(item => renderPost(item)).join('') 
        : '<div class="no-results">No buzz found. Try searching something else!</div>';
}

// Search Logic
function searchPosts() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = zedContent.filter(item => 
        item.caption.toLowerCase().includes(query) || 
        item.tags.toLowerCase().includes(query)
    );
    displayPosts(filtered);
}

// Share Functions
function shareWA(url, title) {
    const text = encodeURIComponent(`*ZedBuzz 🔥 Trending:* \n${title}\n\nWatch here: ${url}`);
    window.open(`https://wa.me{text}`, "_blank");
}

function shareFB(url) {
    window.open(`https://facebook.com{encodeURIComponent(url)}`, "_blank");
}

function copyLink(url) {
    navigator.clipboard.writeText(url).then(() => alert("Link copied! 🇿🇲"));
}

// First display
displayPosts(zedContent);

</script>

</body>
</html>
